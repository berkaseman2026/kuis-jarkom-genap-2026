let quizData = [];
let currentQuestion = 0;
let score = 0;
let timer = null;
let timeLeft = QUESTION_TIME_SECONDS;
//let timeLeft = q.time || 20;

let answered = false;
let quizStarted = false;
let quizFinished = false;
let identitySaved = false;
let namaPeserta = '';
let nimPeserta = '';
let kelasPeserta = '';
let pelanggaran = 0;
const MAX_PELANGGARAN = 3;


const questionDiv = document.getElementById('question');
const optionsDiv = document.getElementById('options');
const timerDiv = document.getElementById('timer');

const startBtn = document.getElementById('startBtn');
const finishBtn = document.getElementById('finishBtn');
const downloadBtn = document.getElementById('downloadBtn');

function setStatus(message) { statusDiv.textContent = message || ''; }
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function validasiPeserta() {
  if (quizStarted || quizFinished) return;
  const nama = document.getElementById('namaPeserta').value.trim();
  const nim = document.getElementById('nimPeserta').value.trim();
  const kelas = document.getElementById('kelasPeserta').value.trim();
  if (!nama || !nim || !kelas) {
    alert('Nama, NIM, dan kelas wajib diisi.');
    return;
  }
  namaPeserta = nama; nimPeserta = nim; kelasPeserta = kelas;
  identitySaved = true;
  document.getElementById('namaPeserta').disabled = true;
  document.getElementById('nimPeserta').disabled = true;
  document.getElementById('kelasPeserta').disabled = true;
  document.getElementById('simpanBtn').disabled = true;
  document.getElementById('pesertaBox').style.display = 'none';
  startBtn.disabled = false;
  questionDiv.innerHTML = `<h3 style="color:green">✓ Identitas peserta berhasil disimpan</h3><div class="info-peserta"><p><b>Nama:</b> ${escapeHTML(namaPeserta)}</p><p><b>NIM:</b> ${escapeHTML(nimPeserta)}</p><p><b>Kelas:</b> ${escapeHTML(kelasPeserta)}</p></div><p><b>Silakan tekan tombol MULAI.</b></p>`;
  setStatus('Identitas tersimpan pada sesi browser ini.');
}
function loadQuestion() {
  if (currentQuestion >= quizData.length) { showAllQuestionsDone(); return; }
  answered = false;
  const q = quizData[currentQuestion];
  questionDiv.innerHTML = `<b>Soal ${currentQuestion + 1} dari ${quizData.length}</b><br><br>${escapeHTML(q.question)}`;
  optionsDiv.replaceChildren();
  q.options.forEach((option, index) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option-btn';
    btn.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
    btn.addEventListener('click', () => checkAnswer(btn, option));
    optionsDiv.appendChild(btn);
  });
  //timeLeft = QUESTION_TIME_SECONDS;
  timeLeft = q.time || 20;
  updateTimerDisplay();
}
function updateTimerDisplay() { timerDiv.textContent = `Waktu: ${timeLeft} detik`; }
function stopTimer() { if (timer !== null) { clearInterval(timer); timer = null; } }
function disableCurrentOptions() { optionsDiv.querySelectorAll('.option-btn').forEach(btn => { btn.disabled = true; }); }
function checkAnswer(button, selected) {
  if (!quizStarted || answered || quizFinished) return;
  answered = true;
  stopTimer();
 
  const correctAnswer = quizData[currentQuestion].answer;
  if (selected === correctAnswer) {score++;}

  disableCurrentOptions();
  button.classList.add('selected');
  
  //=== correctAnswer ? 'correct' : 'incorrect');
 // if (selected !== correctAnswer) {
   // optionsDiv.querySelectorAll('.option-btn').forEach(btn => {
 //     if (btn.textContent.slice(3) === correctAnswer) btn.classList.add('correct');
 //   });""
 // }
//

  window.setTimeout(() => {
    advanceQuestion();
  }, 700);
}
function startQuestionTimer() {
  stopTimer();
  updateTimerDisplay();
  timer = window.setInterval(() => {
    if (!quizStarted || answered) { stopTimer(); return; }
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      answered = true;
      stopTimer();
      disableCurrentOptions();
      timerDiv.textContent = 'Waktu habis';
      setStatus('Waktu untuk soal ini habis; jawaban dihitung salah.');
      window.setTimeout(advanceQuestion, 400);
    }
  }, 1000);
}

function advanceQuestion() {
  if (!quizStarted || quizFinished) return;
  currentQuestion++;
  if (currentQuestion >= quizData.length) { showAllQuestionsDone(); return; }
  loadQuestion();
  startQuestionTimer();
}
function showAllQuestionsDone() {
  stopTimer();
  quizStarted = false;
  timerDiv.textContent = 'SEMUA SOAL TELAH DIPROSES';
  questionDiv.innerHTML = '<h3>Semua soal telah selesai.</h3><p>Silakan klik tombol SELESAI untuk menyimpan hasil.</p>';
  optionsDiv.replaceChildren();
  finishBtn.disabled = false;
}

function masukFullscreen() {

  const elem = document.documentElement;

  if (elem.requestFullscreen) {
    elem.requestFullscreen();
  } else if (elem.webkitRequestFullscreen) {
    elem.webkitRequestFullscreen();
  } else if (elem.msRequestFullscreen) {
    elem.msRequestFullscreen();
  }

}

function tambahPelanggaran(alasan) {
  if (!quizStarted || quizFinished) return;

  pelanggaran++;
  console.log("Jumlah pelanggaran:", pelanggaran);
  
  let pesan = "Pelanggaran: " + pelanggaran + " (" + alasan + ")";
  
  // Jika pelanggaran lebih dari 3, berikan peringatan pengurangan nilai
  if (pelanggaran > 3) {
    let pengurangan = (pelanggaran - 3) * 5;
    pesan += "\n\n⚠️ PERINGATAN: Nilai akhir Anda akan dikurangi " + pengurangan + " poin!";
  }

  setStatus(pesan.replace(/\n/g, ' '));
  alert("Pelanggaran terdeteksi!\n\n" + alasan + "\n\n" + pesan);
  beep();
}


async function autoFinishQuiz(alasan){

  stopTimer();

  quizStarted = false;
  quizFinished = true;

  startBtn.disabled = true;
  finishBtn.disabled = true;

  downloadBtn.disabled = false;
  downloadPDFBtn.disabled = false;

  timerDiv.textContent =
    "UJIAN DIHENTIKAN";

  optionsDiv.replaceChildren();

  const nilaiAkhir = getFinalScore();

  questionDiv.innerHTML =

    <h2 style="color:red">
      Ujian Dihentikan
    </h2>

    <p>${alasan}</p>

    <p><b>Nama:</b> ${escapeHTML(namaPeserta)}</p>

    <p><b>NIM:</b> ${escapeHTML(nimPeserta)}</p>

    <p><b>Kelas:</b> ${escapeHTML(kelasPeserta)}</p>

    <h3>
      Jawaban Benar :
      ${score}
      dari
      ${quizData.length}
    </h3>

    <h1 style="color:red">
      Nilai : ${nilaiAkhir}
    </h1>
    `;

  setStatus(
    "Ujian dihentikan otomatis karena pelanggaran."
  );

  await kirimKeGoogleSheet();
}



function startQuiz() {
  if (quizStarted || quizFinished || !identitySaved) return;
  quizStarted = true;

  pelanggaran = 0;
  masukFullscreen();

  score = 0;
  currentQuestion = 0;
  timeLeft = QUESTION_TIME_SECONDS;
  quizData = originalQuizData.map(q => ({...q, options: [...q.options]}));
  shuffleArray(quizData);
  quizData.forEach(q => shuffleArray(q.options));
  startBtn.disabled = true;
  finishBtn.disabled = true;
  downloadBtn.disabled = true;
  downloadPDFBtn.disabled = true;
  setStatus('Kuis sedang berlangsung.');
  loadQuestion();
  startQuestionTimer();
}


function getFinalScore() {
  // Hitung nilai dasar dari jawaban benar
  let baseScore = quizData.length ? Math.round((score / quizData.length) * 100) : 0;
  let penalty = 0;
  
  // Jika pelanggaran lebih dari 3, kurangi 5 poin untuk setiap pelanggaran tambahan
  if (pelanggaran > 3) {
    penalty = (pelanggaran - 3) * 5;
  }
  
  // Pastikan nilai akhir tidak kurang dari 0
  let finalScore = Math.max(0, baseScore - penalty);
  
  console.log("Nilai Dasar:", baseScore, "| Pengurangan:", penalty, "| Nilai Akhir:", finalScore);
  return finalScore;
}



async function kirimKeGoogleSheet() {
  const data = {
    nama: namaPeserta,
    nim: nimPeserta,
    kelas: kelasPeserta,
    benar: score,
    total: quizData.length,
    nilai: getFinalScore(),
    // HAPUS: waktu: new Date().toLocaleString("id-ID"),
    pelanggaran: pelanggaran
  };

  console.log("Mengirim data:", data);

  try {
    const response = await fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    console.log("Response status:", response.status);
    return { ok: true, message: "Data berhasil dikirim ke Google Spreadsheet." };

  } catch (error) {
    console.error("Fetch error:", error);
    return { ok: false, message: "Gagal mengirim data. Error: " + error.message };
  }
}



function csvEscape(value) { return `"${String(value ?? '').replace(/"/g, '""')}"`; }
function exportCSV() {
  if (!quizFinished) return;
  const rows = [
    ['Nama','NIM','Kelas','JawabanBenar','TotalSoal','Nilai'],
    [namaPeserta,nimPeserta,kelasPeserta,score,quizData.length,getFinalScore()]
  ];
  const csvContent = '\uFEFF' + rows.map(row => row.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  downloadBlob(blob, `${safeFilename(nimPeserta)}_${safeFilename(namaPeserta)}.csv`);
}
function safeFilename(value) { return String(value || 'hasil').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').trim() || 'hasil'; }
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); link.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportPDF() {
  if (!quizFinished) return;
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert('Pustaka PDF belum tersedia. Periksa koneksi internet lalu muat ulang halaman.');
    return;
  }
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(16); doc.text('HASIL KUIS JARINGAN KOMPUTER', 20, 20);
  doc.setFontSize(12);
  doc.text(doc.splitTextToSize(`Nama: ${namaPeserta}`, 170), 20, 40);
  doc.text(doc.splitTextToSize(`NIM: ${nimPeserta}`, 170), 20, 50);
  doc.text(doc.splitTextToSize(`Kelas: ${kelasPeserta}`, 170), 20, 60);
  doc.text(`Jawaban benar: ${score} dari ${quizData.length} soal`, 20, 80);
  doc.text(`Nilai akhir: ${getFinalScore()}`, 20, 95);
  doc.save(`${safeFilename(nimPeserta)}_${safeFilename(namaPeserta)}.pdf`);
}
async function finishQuiz() {
  if (quizFinished || quizStarted || !quizData.length || currentQuestion < quizData.length) return;
  stopTimer();
  quizFinished = true;
  finishBtn.disabled = true;
  startBtn.disabled = true;
  downloadBtn.disabled = false;
  downloadPDFBtn.disabled = false;
  optionsDiv.replaceChildren();
  timerDiv.textContent = 'KUIS SELESAI';
  const nilaiAkhir = getFinalScore();
  questionDiv.innerHTML = `<h2>Terima Kasih</h2><p><b>Nama:</b> ${escapeHTML(namaPeserta)}</p><p><b>NIM:</b> ${escapeHTML(nimPeserta)}</p><p><b>Kelas:</b> ${escapeHTML(kelasPeserta)}</p><h3>Jawaban benar: ${score} dari ${quizData.length} soal</h3><h1 style="color:blue">Nilai: ${nilaiAkhir}</h1><hr><p>Kuis telah selesai.</p>`;
  beep();
  setStatus('Mengirim hasil ke Google Sheets...');
  const result = await kirimKeGoogleSheet();
  setStatus(result.message);
  if (!result.ok) console.warn('Status pengiriman:', result.message);
}
function beep() {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    const audioContext = new AudioContextClass();
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.frequency.value = 1500;
    gain.gain.value = 0.08;
    oscillator.connect(gain); gain.connect(audioContext.destination);
    oscillator.start(); oscillator.stop(audioContext.currentTime + 0.25);
    oscillator.onended = () => audioContext.close();
  } catch (error) { console.warn('Audio tidak dapat diputar:', error); }
}

function resetForNextParticipant() {
  stopTimer();
  quizData = []; 
  currentQuestion = 0; 
  score = 0; 
  timeLeft = QUESTION_TIME_SECONDS;
  answered = false; 
  quizStarted = false; 
  quizFinished = false; 
  identitySaved = false;
  namaPeserta = ''; 
  nimPeserta = ''; 
  kelasPeserta = '';
  pelanggaran = 0; // <-- PENTING: Reset pelanggaran ke 0
  
  ['namaPeserta','nimPeserta','kelasPeserta'].forEach(id => {
    const el = document.getElementById(id); 
    el.value = ''; 
    el.disabled = false;
  });
  
  document.getElementById('pesertaBox').style.display = 'block';
  document.getElementById('simpanBtn').disabled = false;
  startBtn.disabled = true; 
  finishBtn.disabled = true;
  downloadBtn.disabled = true; 
  downloadPDFBtn.disabled = true;
  optionsDiv.replaceChildren();
  questionDiv.textContent = 'Silakan isi identitas peserta berikutnya.';
  timerDiv.textContent = 'SIAP';
  setStatus('Sesi sebelumnya telah direset.');
}



function adminLogin() {
  const password = prompt('Masukkan password admin');
  if (password === null) return;
  if (password === adminPassword) {
    resetForNextParticipant();
    alert('Login admin berhasil. Identitas peserta baru dapat diisi.');
  } else {
    alert('Password salah.');
  }
}
